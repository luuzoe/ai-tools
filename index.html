<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🤖 AI Tools Hub — အခမဲ့ AI tools များ</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<header class="hero">
  <div class="robot-wrap">
    <div id="robot-bubble" class="robot-bubble">မင်္ဂလာပါ! 👋</div>
    <svg id="robot" class="robot" viewBox="0 0 200 252" aria-label="cute robot">
      <defs>
        <linearGradient id="rbody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f0fdfa"/><stop offset="1" stop-color="#99f6e4"/>
        </linearGradient>
        <radialGradient id="rglow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#aef4ff"/><stop offset="1" stop-color="#00d4ff"/>
        </radialGradient>
      </defs>
      <!-- antenna -->
      <line x1="100" y1="30" x2="100" y2="12" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
      <circle class="antenna-ball" cx="100" cy="9" r="7" fill="url(#rglow)"/>
      <!-- ears -->
      <rect x="42" y="52" width="12" height="32" rx="6" fill="#0d9488"/>
      <rect x="146" y="52" width="12" height="32" rx="6" fill="#0d9488"/>
      <!-- head -->
      <rect x="54" y="28" width="92" height="74" rx="26" fill="url(#rbody)" stroke="#0d9488" stroke-width="2"/>
      <!-- eyes -->
      <ellipse class="eye" cx="84" cy="62" rx="10" ry="13" fill="#23264d"/>
      <ellipse class="eye" cx="116" cy="62" rx="10" ry="13" fill="#23264d"/>
      <circle class="eye-hi" cx="87" cy="58" r="3.5" fill="#fff"/>
      <circle class="eye-hi" cx="119" cy="58" r="3.5" fill="#fff"/>
      <!-- blush + smile -->
      <ellipse cx="70" cy="78" rx="7" ry="4.5" fill="#ff9db1" opacity="0.8"/>
      <ellipse cx="130" cy="78" rx="7" ry="4.5" fill="#ff9db1" opacity="0.8"/>
      <path d="M88 82 Q100 93 112 82" stroke="#23264d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <!-- neck + body -->
      <rect x="92" y="102" width="16" height="10" rx="4" fill="#0d9488"/>
      <rect x="64" y="110" width="72" height="72" rx="24" fill="url(#rbody)" stroke="#0d9488" stroke-width="2"/>
      <circle class="core" cx="100" cy="140" r="13" fill="url(#rglow)"/>
      <rect x="80" y="160" width="40" height="8" rx="4" fill="#0d9488" opacity="0.55"/>
      <!-- left arm (static) -->
      <rect x="46" y="118" width="16" height="46" rx="8" fill="#a5f3e8" stroke="#0d9488" stroke-width="2"/>
      <circle cx="54" cy="168" r="10" fill="#a5f3e8" stroke="#0d9488" stroke-width="2"/>
      <!-- right arm (waving) -->
      <g class="arm-wave">
        <rect x="138" y="112" width="16" height="44" rx="8" fill="#a5f3e8" stroke="#0d9488" stroke-width="2"/>
        <circle cx="146" cy="112" r="9" fill="#a5f3e8" stroke="#0d9488" stroke-width="2"/>
      </g>
      <!-- legs -->
      <g class="leg leg-l">
        <rect x="78" y="180" width="18" height="36" rx="9" fill="#a5f3e8" stroke="#0d9488" stroke-width="2"/>
        <ellipse cx="87" cy="220" rx="15" ry="8" fill="#0d9488"/>
      </g>
      <g class="leg leg-r">
        <rect x="104" y="180" width="18" height="36" rx="9" fill="#a5f3e8" stroke="#0d9488" stroke-width="2"/>
        <ellipse cx="113" cy="220" rx="15" ry="8" fill="#0d9488"/>
      </g>
    </svg>
    <div class="robot-shadow"></div>
  </div>
  <div class="hero-text">
    <h1>AI Tools Hub</h1>
    <p class="sub">အခမဲ့ • အကောင့်မလို • ဖုန်းနဲ့တန်းသုံး</p>
    <p class="hint">🤖 robot ကို နှိပ်ကြည့်ပါ!</p>
  </div>
</header>

<div class="waves" aria-hidden="true">
  <svg viewBox="0 0 1440 100" preserveAspectRatio="none">
    <path class="w1" d="M0,50 C240,90 480,10 720,50 C960,90 1200,10 1440,50 L1440,100 L0,100 Z"/>
    <path class="w2" d="M0,65 C260,95 500,35 760,60 C1020,85 1220,40 1440,65 L1440,100 L0,100 Z"/>
  </svg>
</div>

<main id="main">
  <!-- CHAT -->
  <section id="tab-chat" class="tab active">
    <div id="chat-box" class="chat-box">
      <div class="msg ai">မင်္ဂလာပါ! 🙋 ဘာကူညီပေးရမလဲ? မေးခွန်းမေး၊ ဟာသ/ပုံပြင် တောင်း၊ idea ရှာ — အကုန်ရတယ်။</div>
    </div>
    <div class="chips">
      <button data-preset="ဟာသတစ်ခုပြောပြပါ">😂 ဟာသ</button>
      <button data-preset="ကလေးတွေအတွက်ပုံပြင်တိုတစ်ခုပြောပြပါ">📖 ပုံပြင်</button>
      <button data-preset="လုပ်ငန်းအကြံဉာဏ်တစ်ခု ပေးပါ">💡 Idea</button>
      <button data-preset="ရွှေဈေးတက်/ကျစေတဲ့ အဓိကအကြောင်းအရင်းတွေ အကျဉ်းချုပ်ပြောပြပါ">📊 ရွှေဈေး</button>
    </div>
    <div class="input-row">
      <input id="chat-input" type="text" placeholder="ဒီမှာ ရိုက်မေးပါ…" autocomplete="off">
      <button id="chat-send" class="btn-primary">ပို့ ➤</button>
    </div>
  </section>

  <!-- IMAGE -->
  <section id="tab-image" class="tab">
    <div class="card">
      <label>ပုံအကြောင်း ရေးပါ (English လိုရေးရင် ပိုကောင်းတယ်)</label>
      <textarea id="img-prompt" rows="3" placeholder="ဥပမာ: a cute robot drinking bubble tea, sunset"></textarea>
      <div class="row2">
        <div>
          <label>စတိုင်</label>
          <select id="img-style">
            <option value="">သာမာန်</option>
            <option value=", photorealistic, 8k">📷 Realistic</option>
            <option value=", anime style, vibrant">🎌 Anime</option>
            <option value=", 3d render, pixar style">🧊 3D</option>
            <option value=", cartoon illustration">🎨 Cartoon</option>
          </select>
        </div>
        <div>
          <label>အရွယ်အစား</label>
          <select id="img-size">
            <option value="1024,1024">⬛ Square</option>
            <option value="768,1024">📱 Portrait</option>
            <option value="1024,768">🖥️ Landscape</option>
          </select>
        </div>
      </div>
      <button id="img-gen" class="btn-primary btn-block">🎨 ပုံထုတ်မယ်</button>
    </div>
    <div id="img-result" class="img-result hidden">
      <div id="img-loading" class="loading">⏳ ပုံထုတ်နေတယ်… ခဏစောင့်ပါ</div>
      <img id="img-out" class="hidden" alt="AI generated image">
      <a id="img-dl" class="btn-primary btn-block hidden" download="ai-image.jpg">⬇️ ပုံကို သိမ်းမယ်</a>
    </div>
  </section>

  <!-- TTS -->
  <section id="tab-tts" class="tab">
    <div class="card">
      <label>ဖတ်စေချင်တဲ့ စာသား</label>
      <textarea id="tts-text" rows="4" placeholder="ဒီမှာ စာရိုက်ပါ…"></textarea>
      <label>အသံ</label>
      <select id="tts-voice"><option>အသံများ ရှာနေတယ်…</option></select>
      <label>အမြန်နှုန်း: <span id="tts-rate-val">1.0</span></label>
      <input id="tts-rate" type="range" min="0.5" max="2" step="0.1" value="1">
      <div class="row2">
        <button id="tts-speak" class="btn-primary">🔊 ဖတ်မယ်</button>
        <button id="tts-stop" class="btn-ghost">⏹️ ရပ်</button>
      </div>
      <p class="note">📌 မြန်မာအသံလိုချင်ရင် ဒီ site ကို သုံးပါ 👉 <a href="https://luuzoe.github.io/voice-ai/">Voice AI</a></p>
    </div>
  </section>

  <!-- TRANSLATE -->
  <section id="tab-translate" class="tab">
    <div class="card">
      <div class="row2">
        <button id="tr-dir" class="btn-ghost">မြန်မာ ➜ English</button>
        <button id="tr-go" class="btn-primary">🌐 ဘာသာပြန်မယ်</button>
      </div>
      <label>မူရင်းစာသား</label>
      <textarea id="tr-input" rows="4" placeholder="ဒီမှာ စာရိုက်ပါ…"></textarea>
      <label>ဘာသာပြန်ပြီး</label>
      <div id="tr-output" class="output-box">…</div>
      <button id="tr-copy" class="btn-ghost btn-block">📋 Copy ကူးမယ်</button>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="tab-chat" class="active">💬<span>Chat</span></button>
  <button data-tab="tab-image">🎨<span>ပုံထုတ်</span></button>
  <button data-tab="tab-tts">🔊<span>အသံဖတ်</span></button>
  <button data-tab="tab-translate">🌐<span>ဘာသာပြန်</span></button>
</nav>

<script src="app.js?v=6"></script>
</body>
</html>
